<!doctype html>
<html><head><meta charset="utf-8"><title>Direcciones de personaje</title>
<style>
body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#222}
.grid{display:grid;grid-template-columns:repeat(3,400px);gap:14px;padding:14px}
.card{border:1px solid #ddd;border-radius:10px;padding:10px;background:#fafafa}
h2{font-size:17px;margin:2px 0 4px} p{font-size:11.5px;margin:2px 0 6px;line-height:1.3}
.row{display:flex;align-items:flex-end;gap:10px}
.main{width:230px;height:300px;border-radius:8px}
.side{display:flex;flex-direction:column;gap:8px;align-items:center}
.sil svg{filter:brightness(0)}
.lbl{font-size:10px;color:#666;text-align:center}
.sw{display:flex;gap:3px;margin-top:6px}.sw div{width:52px;height:30px;border-radius:4px;font-size:8.5px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;text-shadow:0 0 2px #000}
</style></head><body><div class="grid" id="g"></div>
<script>
const INK='#2B2B33';
const paper=`<filter id="pp"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>`;
const D=[
{n:'1 · Mechón (geométrico redondo)',d:'3 cabezas. Cabeza círculo, cuerpo trapecio suave, sin cuello. El mechón en onda es el rasgo firma y el barómetro emocional.',
bg:'#FBF4EA',pal:['#F4A38C','#2B2D5C','#2F8F83','#F2B544','#FBF4EA'],
svg:`<rect x="72" y="118" width="56" height="110" rx="26" fill="#2F8F83"/>
<rect x="80" y="222" width="14" height="50" rx="7" fill="#2B2D5C"/><rect x="106" y="222" width="14" height="50" rx="7" fill="#2B2D5C"/>
<rect x="56" y="130" width="16" height="70" rx="8" fill="#2F8F83" transform="rotate(12 64 130)"/><rect x="128" y="130" width="16" height="70" rx="8" fill="#2F8F83" transform="rotate(-12 136 130)"/>
<circle cx="100" cy="78" r="42" fill="#F4A38C"/>
<path d="M58,72 C60,40 90,30 110,36 C130,40 144,56 142,74 C130,62 112,58 96,62 C82,64 70,70 58,72Z" fill="#2B2D5C"/>
<path d="M100,36 C96,20 112,12 120,22 C126,30 116,38 110,32" fill="none" stroke="#2B2D5C" stroke-width="7" stroke-linecap="round"/>
<circle cx="86" cy="84" r="4.5" fill="${INK}"/><circle cx="114" cy="84" r="4.5" fill="${INK}"/>
<path d="M80,74 L92,72" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M108,72 L120,74" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
<path d="M93,98 Q100,103 107,98" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`},
{n:'2 · Barro (persona terracota, editorial)',d:'4 cabezas. Suéter oversized de cuello alto (silueta de bloque). Piel color barro no realista; elenco en otros tonos de barro, jade y añil.',
bg:'#F4E9DA',pal:['#D27D56','#2E3A6B','#E9A23B','#3E8E7E','#F4E9DA'],
svg:`<path d="M58,128 Q100,112 142,128 L150,222 Q100,232 50,222Z" fill="#2E3A6B"/>
<rect x="84" y="108" width="32" height="26" rx="10" fill="#2E3A6B"/>
<rect x="82" y="220" width="13" height="56" rx="6" fill="#3B2A24"/><rect x="105" y="220" width="13" height="56" rx="6" fill="#3B2A24"/>
<ellipse cx="100" cy="74" rx="30" ry="36" fill="#D27D56"/>
<path d="M68,70 C66,40 92,30 112,36 C132,42 136,62 132,74 C124,58 104,52 86,56 C78,58 72,64 68,70Z" fill="#3B2A24"/>
<path d="M84,82 Q89,78 94,82" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M106,82 Q111,78 116,82" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
<path d="M100,86 L98,96 L102,96" fill="none" stroke="#A8553A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M94,103 Q100,106 106,103" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="84" cy="94" r="5" fill="#E76F8A" opacity=".45"/><circle cx="116" cy="94" r="5" fill="#E76F8A" opacity=".45"/>
<path d="M60,140 Q50,180 66,206" fill="none" stroke="#2E3A6B" stroke-width="15" stroke-linecap="round"/><path d="M140,140 Q150,180 134,206" fill="none" stroke="#2E3A6B" stroke-width="15" stroke-linecap="round"/>`},
{n:'3 · Línea viva (trazo + 1 acento)',d:'3 cabezas. Línea tinta de grosor variable, ojos grandes con ojeras. La “mancha de emoción” coral es el rasgo firma.',
bg:'#F6F1E7',pal:['#1F2A44','#FF6F59','#F6F1E7','#7FB7BE','#F2C14E'],
svg:`<g fill="none" stroke="#1F2A44" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M64,80 C60,40 140,36 138,80 C138,112 120,124 100,124 C80,124 66,110 64,80Z" fill="#fff"/>
<path d="M62,74 C58,48 74,30 96,34 C100,24 122,26 126,38 C140,42 146,60 138,76 C132,64 126,60 118,62 C112,52 100,58 92,52 C84,60 72,62 62,74Z" fill="#1F2A44"/>
<circle cx="86" cy="88" r="11" fill="#fff"/><circle cx="116" cy="88" r="11" fill="#fff"/>
<path d="M78,102 Q86,106 94,102 M108,102 Q116,106 124,102" stroke-width="2"/>
<path d="M96,114 Q100,112 104,114"/>
<path d="M80,124 C76,160 74,200 78,226 L122,226 C126,200 124,160 120,124" fill="#fff"/>
<path d="M80,140 C66,160 66,180 72,196 M120,140 C134,160 134,180 128,196"/>
<path d="M88,226 L86,274 M112,226 L114,274"/></g>
<circle cx="88" cy="89" r="4" fill="#1F2A44"/><circle cx="118" cy="89" r="4" fill="#1F2A44"/>
<path d="M92,150 C84,138 96,128 102,138 C108,128 120,138 112,150 L102,162Z" fill="#FF6F59" opacity=".9"/>`},
{n:'4 · Papel recortado (cutout artesanal)',d:'3.5 cabezas. Formas de papel con fibra y borde irregular; se anima como recorte real. Señal fuerte de “hecho a mano”.',
bg:'#EDE4D3',pal:['#F0C9A5','#E3A72F','#1E1E24','#C8553D','#EDE4D3'],
svg:`<g filter="url(#pp)">
<path d="M70,124 L132,122 L144,226 L58,228Z" fill="#E3A72F"/>
<path d="M58,130 L72,128 L66,204 L54,204Z" fill="#E3A72F"/><path d="M130,128 L144,130 L148,204 L136,206Z" fill="#E3A72F"/>
<path d="M80,226 L94,226 L92,278 L80,278Z" fill="#1E1E24"/><path d="M106,226 L120,226 L122,278 L108,278Z" fill="#1E1E24"/>
<circle cx="100" cy="78" r="40" fill="#F0C9A5"/>
<path d="M60,76 C58,46 80,32 104,34 C128,36 142,52 140,72 L128,60 L118,70 L106,56 L94,68 L82,56 L70,70Z" fill="#1E1E24"/>
<circle cx="86" cy="86" r="4.5" fill="#1E1E24"/><circle cx="114" cy="86" r="4.5" fill="#1E1E24"/>
<path d="M92,100 L108,100 L100,106Z" fill="#C8553D"/></g>`},
{n:'5 · Cabezón de sketch (humor)',d:'2.2 cabezas. Cabeza squircle enorme, ojos de esclera grande. Rasgo firma: sudadera con capucha violeta que forma un “halo” en la silueta.',
bg:'#FFF7EE',pal:['#F9D3B9','#5B4BDB','#2B2B33','#FFC93C','#FFF7EE'],
svg:`<path d="M44,70 C44,18 156,18 156,70 L156,120 L44,120Z" fill="#5B4BDB"/>
<rect x="64" y="150" width="72" height="80" rx="22" fill="#5B4BDB" stroke="${INK}" stroke-width="4"/>
<rect x="76" y="226" width="14" height="46" rx="6" fill="${INK}"/><rect x="110" y="226" width="14" height="46" rx="6" fill="${INK}"/>
<rect x="52" y="34" width="96" height="120" rx="40" fill="#F9D3B9" stroke="${INK}" stroke-width="4"/>
<path d="M52,74 C56,40 80,30 100,32 C126,32 146,44 148,74 C130,62 116,66 100,58 C86,66 70,62 52,74Z" fill="${INK}"/>
<ellipse cx="82" cy="96" rx="15" ry="17" fill="#fff" stroke="${INK}" stroke-width="3.5"/><ellipse cx="118" cy="96" rx="15" ry="17" fill="#fff" stroke="${INK}" stroke-width="3.5"/>
<circle cx="85" cy="99" r="5" fill="${INK}"/><circle cx="115" cy="99" r="5" fill="${INK}"/>
<path d="M88,130 Q100,140 112,130" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
<path d="M90,152 L88,176 M110,152 L112,176" stroke="#FFC93C" stroke-width="3" stroke-linecap="round"/>`},
{n:'6 · Cabeza-ventana (clima interno)',d:'3 cabezas. La cabeza es un círculo-ventana con cielo dentro; el clima cambia con la emoción (sol, nube, tormenta). “Lo invisible, visible”.',
bg:'#F7F2EA',pal:['#1E2140','#8EC5E8','#FFD66B','#6B6F8F','#E7B89A'],
svg:`<defs><clipPath id="hc"><circle cx="100" cy="82" r="46"/></clipPath><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EC5E8"/><stop offset="1" stop-color="#FFE9B0"/></linearGradient></defs>
<path d="M70,128 Q100,118 130,128 L136,228 L64,228Z" fill="#1E2140"/>
<rect x="80" y="226" width="13" height="48" rx="6" fill="#1E2140"/><rect x="107" y="226" width="13" height="48" rx="6" fill="#1E2140"/>
<path d="M68,138 Q56,176 70,204" fill="none" stroke="#1E2140" stroke-width="13" stroke-linecap="round"/><path d="M132,138 Q144,176 130,204" fill="none" stroke="#1E2140" stroke-width="13" stroke-linecap="round"/>
<circle cx="70" cy="206" r="7" fill="#E7B89A"/><circle cx="130" cy="206" r="7" fill="#E7B89A"/>
<g clip-path="url(#hc)"><rect x="50" y="30" width="100" height="110" fill="url(#sk)"/><circle cx="118" cy="62" r="13" fill="#FFD66B"/>
<path d="M66,74 q6,-12 18,-6 q8,-8 16,2 q10,0 8,10 h-40z" fill="#fff"/><rect x="50" y="96" width="100" height="40" fill="#E7B89A"/></g>
<circle cx="100" cy="82" r="46" fill="none" stroke="#1E2140" stroke-width="5"/>
<circle cx="88" cy="108" r="3.5" fill="#1E2140"/><circle cx="112" cy="108" r="3.5" fill="#1E2140"/><path d="M95,118 Q100,121 105,118" fill="none" stroke="#1E2140" stroke-width="2.5" stroke-linecap="round"/>`}
];
const g=document.getElementById('g');
D.forEach((x,i)=>{
 const s=(w,h)=>`<svg width="${w}" height="${h}" viewBox="40 10 120 275"><defs>${paper}</defs>${x.svg}</svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="card"><h2>${x.n}</h2><p>${x.d}</p>
 <div class="row"><div class="main" style="background:${x.bg}">${s(230,300)}</div>
 <div class="side"><div class="sil">${s(70,160)}</div><div class="lbl">silueta</div>
 <div style="background:${x.bg};border-radius:50%;width:48px;height:48px;overflow:hidden;display:flex;justify-content:center"><svg width="48" height="48" viewBox="50 25 100 100"><defs>${paper}</defs>${x.svg}</svg></div><div class="lbl">avatar 48px</div></div></div>
 <div class="sw">${x.pal.map(c=>`<div style="background:${c}">${c}</div>`).join('')}</div></div>`);
});
</script></body></html>
